  zenoh:
    image: eclipse/zenoh-bridge-ros2dds:latest
    environment:
      - CYCLONEDDS_URI=file:///etc/cyclonedds/cyclonedds.xml
      - ROS_DOMAIN_ID=0
      - ROS_DISTRO=humble
    ports:
      - 7447:7447
      - 8888:8888
    volumes:
      - ./cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
    command: "-l tcp/0.0.0.0:7447 -r 0.0.0.0:8888 -d 0 -m peer"
#    networks:
#      - ros_network
#      - zenoh_network
    network_mode: host

  ros_bridge:
    build:
      context: .
      dockerfile: Dockerfile.ros_bridge
    environment:
      - CYCLONEDDS_URI=file:///etc/cyclonedds/cyclonedds.xml
      - ROS_DOMAIN_ID=0
      - ROS_MASTER_URI=http://localhost:11311/
    ports:
      - 11311:11311
    user: ros
    volumes:
      - ./cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
      - ./rosbridge.conf:/rosbridge.conf
    command: "/bin/bash -c 'sleep 5; ros2 run ros1_bridge dynamic_bridge --bridge-all-topics'"
#    networks:
#      - ros_network
    network_mode: host

